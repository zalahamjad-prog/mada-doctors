<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/mada-logo.png">
<title>مدى كير | طلبات زيارتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --g: #0b6b5c; --gd: #07463d; --gold: #c8a45a; --ink: #10232b; --mu: #6b7a80; --line: #e3e8ea; --soft: #f4f8f7; --bg: #f3f6f6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Tajawal, Inter, Arial, sans-serif; font-size: 15px; -webkit-font-smoothing: antialiased; }
  html[lang="en"] body { font-family: Inter, Tajawal, Arial, sans-serif; }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .hero { background: linear-gradient(130deg, var(--gd), var(--g)); color: #fff; padding: 18px 16px 64px; border-radius: 0 0 28px 28px; }
  .top { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .logo { width: 48px; height: 48px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 0 0 3px rgba(200,164,90,.55); flex: none; }
  .logo img { height: 32px; }
  .brand { flex: 1; } .brand b { display: block; font-size: 18px; } .brand small { opacity: .85; font-size: 12.5px; }
  .lang { border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.1); color: #fff; border-radius: 20px; padding: 7px 14px; font: inherit; font-size: 13.5px; cursor: pointer; }
  .hero h1 { max-width: 560px; margin: 22px auto 4px; font-size: 24px; }
  .hero p { max-width: 560px; margin: 0 auto; opacity: .88; font-size: 14.5px; line-height: 1.6; }
  main { max-width: 560px; margin: -44px auto 0; padding: 0 16px 40px; }
  .card { background: #fff; border-radius: 18px; border: 1px solid var(--line); box-shadow: 0 8px 26px rgba(16,35,43,.06); padding: 18px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 12px; font-size: 17px; display: flex; align-items: center; gap: 10px; }
  .ic { width: 34px; height: 34px; border-radius: 10px; background: #e6f3ef; color: var(--g); display: grid; place-items: center; flex: none; }
  .ic svg { width: 18px; height: 18px; }
  .rows { display: grid; gap: 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; } .row span { color: var(--mu); } .row b { text-align: end; }
  .sum { background: linear-gradient(180deg, #fbf7ee, #fff); border-color: #eedfbd; }
  .sum .ic { background: #f8edd5; color: #9a6b12; }
  .sum p { margin: 0 0 12px; line-height: 1.8; font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; background: #fff; border: 1px solid #eedfbd; font-size: 13.5px; font-weight: 600; }
  .chip em { font-style: normal; color: #9a6b12; }
  .grp { margin-top: 6px; } .grp + .grp { margin-top: 16px; }
  .grp h3 { margin: 0 0 8px; font-size: 13px; color: var(--g); letter-spacing: .2px; }
  .svc { list-style: none; margin: 0; padding: 0; }
  .svc li { display: flex; gap: 12px; justify-content: space-between; padding: 11px 0; border-top: 1px solid #eef2f3; }
  .svc li:first-child { border-top: 0; }
  .svc b { display: block; font-size: 14.5px; } .svc small { display: block; color: var(--mu); font-size: 12.5px; margin-top: 3px; line-height: 1.5; }
  .svc em { font-style: normal; font-weight: 700; white-space: nowrap; font-size: 14px; } .svc em.free { color: var(--g); font-weight: 600; font-size: 13px; }
  .tot .row.big { margin-top: 4px; padding: 14px 16px; border-radius: 14px; background: #fdf4e3; border: 1px solid #f3dcb0; font-size: 16px; }
  .tot .row.big span { color: #6b4a12; font-weight: 600; } .tot .row.big b { font-size: 22px; color: #9a5a00; }
  .methods { display: grid; gap: 10px; }
  .m { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; background: #fff; }
  .m input { accent-color: var(--g); width: 18px; height: 18px; margin: 0; }
  .m b { flex: 1; font-size: 14.5px; } .m:has(input:checked) { border-color: var(--g); background: #f3faf7; }
  .bdg { font: 700 12px Inter, sans-serif; padding: 4px 9px; border-radius: 7px; direction: ltr; }
  .b-apple { background: #000; color: #fff; } .b-mada { background: #e9f1fb; color: #1b5fae; } .b-tamara { background: #fbe9dc; color: #b8521a; } .b-tabby { background: #3bf0b0; color: #10232b; }
  .pay { width: 100%; height: 56px; border: 0; border-radius: 14px; background: var(--g); color: #fff; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 14px; box-shadow: 0 10px 22px rgba(11,107,92,.25); }
  .pay:disabled { opacity: .6; }
  .safe { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; color: var(--mu); font-size: 12.5px; }
  .safe svg { width: 14px; height: 14px; }
  .state { text-align: center; padding: 28px 18px; }
  .state .big { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 12px; background: #e7f6ec; color: #15803d; }
  .state.bad .big { background: #fdecec; color: #dc2626; } .state.wait .big { background: #eef4f5; color: var(--mu); }
  .state .big svg { width: 30px; height: 30px; } .state h2 { justify-content: center; margin-bottom: 6px; } .state p { color: var(--mu); margin: 0; line-height: 1.6; }
  .receipt { text-align: start; margin-top: 16px; }
  .foot { text-align: center; color: var(--mu); font-size: 12.5px; margin-top: 18px; }
  .ov { position: fixed; inset: 0; background: rgba(16,35,43,.55); display: grid; place-items: center; z-index: 9; color: #fff; font-weight: 700; }
  .spin { width: 42px; height: 42px; border-radius: 50%; border: 4px solid rgba(255,255,255,.35); border-top-color: #fff; animation: r 1s linear infinite; margin: 0 auto 12px; }
  .ov[hidden] { display: none; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header class="hero">
  <div class="top"><span class="logo"><img src="assets/mada-logo.png" alt=""></span><div class="brand"><b id="brand">مدى كير</b><small id="tag">رعاية كالعائلة</small></div><button type="button" class="lang" id="langBtn">English</button></div>
  <h1 id="hTitle"></h1><p id="hSub"></p>
</header>
<main id="main"></main>
<div class="ov" id="busy" hidden><div><div class="spin"></div><span id="busyT"></span></div></div>
<script src="auth.js"></script>
<script src="orders.js"></script>
<script src="doctor-orders.js"></script>
<script>
  // Patient page for a doctor visit's orders, opened from the link the doctor sends (WhatsApp or SMS from the Orders & Services step).
  // visit-pay.html?t=<token>&l=ar|en. The token is doctorVisit.payLink.token, a random 128-bit value.
  // Shows a plain-language summary of what was ordered, each service with what it is and its price, and the amount due.
  // Demo: reads the order from the shared store and records the payment straight away. TODO: before real patient data, the backend
  // must return only this visit for the token, and the payment must go through the payment gateway and its callback.
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const qs = new URLSearchParams(location.search), token = qs.get("t") || "";
  const svg = (p, w) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w || 2}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const IC = { doc: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>', spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
    list: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h1M4 12h1M4 18h1"/>', wallet: '<path d="M4 7a2 2 0 0 1 2-2h11v4"/><path d="M4 7v11a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14.5" r="1.2"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', check: '<path d="m5 12 5 5 9-10"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>' };
  const L = {
    ar: { brand: "مدى كير", tag: "رعاية كالعائلة", other: "English", title: "طلبات زيارتك", sub: "راجع ملخص الطلبات اللي طلبها لك الطبيب، وادفع بأمان.",
      visitT: "بيانات الزيارة", patient: "المريض", doctor: "الطبيب", date: "تاريخ الزيارة", visitNo: "رقم الزيارة",
      sumT: "ملخص طلبك", sumP: "طلب لك {d} بعد زيارتك {n}. هذي قائمة بكل خدمة ووش هي، والمبلغ المطلوب منك {a}.", sumFree: "طلب لك {d} بعد زيارتك {n}، وكلها بدون رسوم.",
      svc1: "خدمة واحدة", svc2: "خدمتين", svcN: "{n} خدمات", detT: "تفاصيل الخدمات", free: "بدون رسوم", totT: "المبلغ",
      total: "إجمالي الطلبات", paid: "المدفوع", due: "المبلغ المطلوب", sar: "ريال", howPay: "طريقة الدفع",
      m_apple: "Apple Pay", m_card: "بطاقة مدى أو فيزا", m_tamara: "تمارا · قسّمها على 4", m_tabby: "تابي · قسّمها على 4", payBtn: "ادفع {n}", safe: "الدفع آمن ومشفّر",
      busy: "جاري الدفع…", paidT: "تم الدفع، شكراً لك", paidS: "وصل الدفع لفريق مدى كير. نتمنى لك الصحة والعافية.", paidAmt: "المبلغ المدفوع", paidAt: "وقت الدفع", via: "طريقة الدفع",
      loading: "جاري تحميل طلبك…", badT: "الرابط غير صالح", badS: "تأكد من الرابط اللي وصلك، أو تواصل مع فريق مدى كير.", foot: "مدى كير · رعاية صحية منزلية" },
    en: { brand: "Mada Care", tag: "Caring Like Family", other: "العربية", title: "Your Visit Orders", sub: "Review what your doctor ordered for you, then pay securely.",
      visitT: "Visit details", patient: "Patient", doctor: "Doctor", date: "Visit date", visitNo: "Visit No.",
      sumT: "Your order in brief", sumP: "After your visit, {d} ordered {n} for you. Below is each service and what it is. The amount due is {a}.", sumFree: "After your visit, {d} ordered {n} for you, all with no fee.",
      svc1: "one service", svc2: "two services", svcN: "{n} services", detT: "Service details", free: "No fee", totT: "Amount",
      total: "Orders total", paid: "Paid", due: "Amount due", sar: "SAR", howPay: "Payment method",
      m_apple: "Apple Pay", m_card: "mada or Visa card", m_tamara: "Tamara · split in 4", m_tabby: "Tabby · split in 4", payBtn: "Pay {n}", safe: "Secure, encrypted payment",
      busy: "Processing payment…", paidT: "Payment received, thank you", paidS: "Your payment reached the Mada Care team. Wishing you good health.", paidAmt: "Amount paid", paidAt: "Paid on", via: "Method",
      loading: "Loading your order…", badT: "This link is not valid", badS: "Check the link you received, or contact the Mada Care team.", foot: "Mada Care · Home healthcare" }
  };
  const APPLE = '<svg viewBox="0 0 24 24" aria-hidden="true" style="width:12px;height:12px;vertical-align:-1px"><path fill="currentColor" d="M16.4 12.6c0-2.4 2-3.5 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.5-1-2.5-4zM14 5.4c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.6 2.8-1.4z"/></svg>';
  const VIA = [["apple", "b-apple", " Pay"], ["card", "b-mada", "mada · VISA"], ["tamara", "b-tamara", "tamara"], ["tabby", "b-tabby", "tabby"]];
  let lang = qs.get("l") === "en" ? "en" : "ar", method = "apple", tracked = false, started = Date.now();
  try { if (!qs.get("l")) lang = localStorage.getItem("mada-pay-lang") || lang; } catch (e) {}
  const t = () => L[lang], tx = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]);
  const T = v => v && typeof v === "object" ? v[lang] || v.en || v.ar || "" : v || "";
  const money = n => `${Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 })} ${t().sar}`;
  const fmtD = s => { if (!s) return ""; const d = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + "T00:00") : new Date(s); return d.toLocaleDateString(lang === "ar" ? "ar-SA-u-nu-latn-ca-gregory" : "en-GB", { day: "numeric", month: "long", year: "numeric" }); };
  const fmtDT = s => new Date(s).toLocaleString(lang === "ar" ? "ar-SA-u-nu-latn-ca-gregory" : "en-GB", { day: "numeric", month: "long", hour: "numeric", minute: "2-digit" });
  const find = () => token.length >= 32 ? MadaOrders.all().find(o => o.doctorVisit && o.doctorVisit.payLink && o.doctorVisit.payLink.token === token) || null : null;
  const doctorOf = o => { const id = (o.booking && o.booking.doctorId) || o.doctorId; const s = MadaStore.getJSON("mada-staff", []).find(x => x.id === id);
    return s ? s.name : ((MadaOrders.DOCTORS || []).find(x => x.id === id) || {}).name || (o.doctorVisit && o.doctorVisit.by) || ""; };
  const state = (k, icon, h, p, extra) => `<section class="card state ${k}"><div class="big">${svg(icon, 2.4)}</div><h2>${h}</h2><p>${p}</p>${extra || ""}</section>`;

  function render() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = lang === "ar" ? "مدى كير | طلبات زيارتك" : "Mada Care | Your visit orders";
    $("brand").textContent = t().brand; $("tag").textContent = t().tag; $("langBtn").textContent = t().other; $("busyT").textContent = t().busy;
    $("hTitle").textContent = t().title; $("hSub").textContent = t().sub;
    const o = find();
    if (!o) {
      // A new device has nothing stored yet: wait for the shared data before saying the link is not valid.
      const wait = token.length >= 32 && Date.now() - started < 10000;
      $("main").innerHTML = wait ? state("wait", IC.clock, t().loading, "") : state("bad", IC.x, t().badT, t().badS);
      if (wait) setTimeout(render, 1500);
      return;
    }
    track(o);
    const b = DrOrders.bill(o, lang), d = T(doctorOf(o)), n = b.groups.reduce((s, g) => s + g.items.length, 0);
    const nTxt = n === 1 ? t().svc1 : n === 2 ? t().svc2 : tx(t().svcN, { n });
    const last = (b.entries || []).slice(-1)[0];
    if (b.total > 0 && b.due <= 0) {
      $("main").innerHTML = state("ok", IC.check, t().paidT, t().paidS, `<div class="rows receipt">
        <div class="row"><span>${t().paidAmt}</span><b>${money(b.paid)}</b></div>${last ? `<div class="row"><span>${t().paidAt}</span><b>${esc(fmtDT(last.at))}</b></div>` : ""}
        ${last && last.via ? `<div class="row"><span>${t().via}</span><b>${esc(t()["m_" + last.via].split(" · ")[0])}</b></div>` : ""}<div class="row"><span>${t().visitNo}</span><b class="ltr">${esc(o.id)}</b></div></div>`) + `<p class="foot">${t().foot}</p>`;
      return;
    }
    const date = (o.appointment && o.appointment.date) || o.createdAt;
    $("main").innerHTML = `
      <section class="card sum"><h2><span class="ic">${svg(IC.spark)}</span>${t().sumT}</h2>
        <p>${esc(tx(b.due > 0 ? t().sumP : t().sumFree, { d, n: nTxt, a: money(b.due) }))}</p>
        <div class="chips">${b.groups.map(g => `<span class="chip">${esc(g.name)} <em>${g.items.length}</em></span>`).join("")}</div></section>
      <section class="card"><h2><span class="ic">${svg(IC.list)}</span>${t().detT}</h2>
        ${b.groups.map(g => `<div class="grp"><h3>${esc(g.name)}</h3><ul class="svc">${g.items.map(i => `<li><span><b>${esc(i.name)}</b>${i.about ? `<small>${esc(i.about)}</small>` : ""}</span>
          <em class="${i.price ? "" : "free"}">${i.price ? money(i.price) : t().free}</em></li>`).join("")}</ul></div>`).join("")}</section>
      <section class="card"><h2><span class="ic">${svg(IC.doc)}</span>${t().visitT}</h2><div class="rows">
        <div class="row"><span>${t().patient}</span><b>${esc(T(o.patient))}</b></div>${d ? `<div class="row"><span>${t().doctor}</span><b>${esc(d)}</b></div>` : ""}
        <div class="row"><span>${t().date}</span><b>${esc(fmtD(date))}</b></div><div class="row"><span>${t().visitNo}</span><b class="ltr">${esc(o.id)}</b></div></div></section>
      ${b.due > 0 ? `<section class="card tot"><h2><span class="ic">${svg(IC.wallet)}</span>${t().totT}</h2><div class="rows">
          <div class="row"><span>${t().total}</span><b>${money(b.total)}</b></div>${b.paid ? `<div class="row"><span>${t().paid}</span><b>${money(b.paid)}</b></div>` : ""}
          <div class="row big"><span>${t().due}</span><b>${money(b.due)}</b></div></div></section>
        <section class="card"><h2>${t().howPay}</h2><div class="methods">${VIA.map(([k, c, lbl]) => `<label class="m"><input type="radio" name="via" value="${k}" ${method === k ? "checked" : ""}><b>${t()["m_" + k]}</b><span class="bdg ${c}">${k === "apple" ? APPLE : ""}${lbl}</span></label>`).join("")}</div>
          <button type="button" class="pay" id="payBtn">${esc(tx(t().payBtn, { n: money(b.due) }))}</button><div class="safe">${svg(IC.lock)}${t().safe}</div></section>` : ""}
      <p class="foot">${t().foot}</p>`;
    document.querySelectorAll("input[name=via]").forEach(r => r.addEventListener("change", e => { method = e.target.value; }));
    if ($("payBtn")) $("payBtn").addEventListener("click", pay);
  }
  // Record that the patient opened the link (the doctor's payment card shows it).
  function track(o) {
    if (tracked) return; tracked = true;
    const dv = o.doctorVisit, pl = dv.payLink, now = new Date().toISOString();
    MadaOrders.update(o.id, { doctorVisit: { ...dv, payLink: { ...pl, openedAt: pl.openedAt || now, lastOpenAt: now, opens: (pl.opens || 0) + 1 } } });
  }
  function pay() {
    $("busy").hidden = false;
    // TODO: hand over to the payment gateway (Apple Pay, card, Tamara or Tabby) and record the payment from its callback.
    setTimeout(() => {
      const o = find(); if (!o) { $("busy").hidden = true; return render(); }
      const dv = o.doctorVisit, b = DrOrders.bill(o, lang), pay = dv.payment || {};
      if (b.due > 0) {
        const e = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), amount: b.due, method: "card", channel: "link", via: method, received: b.due, ref: "", at: new Date().toISOString(), by: { en: "Patient (payment link)", ar: "المريض (رابط الدفع)" } };
        MadaOrders.update(o.id, { doctorVisit: { ...dv, payment: { ...pay, entries: [...(pay.entries || []), e] } } });
      }
      $("busy").hidden = true; scrollTo(0, 0); render();
    }, 1400);
  }
  $("langBtn").addEventListener("click", () => { lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("mada-pay-lang", lang); } catch (e) {} render(); });
  // The doctor's changes (or a payment from another device) show up without a reload.
  window.addEventListener("storage", e => { if ((!e.key || e.key === "mada-orders" || e.key === "mada-staff") && $("busy").hidden) render(); });
  render();
</script>
</body>
</html>
