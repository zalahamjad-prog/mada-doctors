<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/mada-logo.png">
<title>Mada Care | Patient File</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="doctor-patient.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0b6b5c; --primary-soft: #e6f3ef; --teal: #12a37f; --navy: #0b3a55;
    --ink: #10232b; --muted: #6b7a80; --border: #e3e8ea; --page: #f6f8f9;
    --orange: #d97706; --orange-soft: #fef3e2;
    --font: "Inter", "Tajawal", system-ui, sans-serif;
  }
  [dir="rtl"] { --font: "Tajawal", "Inter", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--page); color: var(--ink); min-height: 100vh; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }

  /* Sidebar */
  .side { position: sticky; top: 0; height: 100vh; background: #fff; border-inline-end: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; gap: 22px; overflow: hidden; }
  .logo { display: flex; align-items: center; gap: 8px; padding: 0 6px; text-decoration: none; color: var(--ink); }
  .logo img { height: 40px; width: auto; }
  .logo b { display: block; font-size: 18px; font-weight: 600; line-height: 1.1; }
  .logo small { font-size: 10.5px; color: var(--primary); }
  .menu { display: grid; gap: 4px; }
  .menu a { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #2c3d43; font-size: 14px; font-weight: 500; }
  .menu a svg { width: 21px; height: 21px; flex: none; }
  .menu a:hover { background: #f3f6f7; }
  .menu a[aria-current="page"] { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .menu a.soon { color: #8a979c; cursor: default; }
  .menu a.soon:hover { background: none; }
  .soon-tag { margin-inline-start: auto; height: 18px; padding: 0 7px; border-radius: 9px; background: var(--orange-soft); color: var(--orange); font-size: 10.5px; font-weight: 600; line-height: 18px; }
  .support { order: 3; display: flex; align-items: center; gap: 12px; padding: 14px 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .support svg { width: 26px; height: 26px; color: #2c3d43; flex: none; }
  .support b { display: block; font-weight: 600; }
  .support a { color: var(--muted); text-decoration: none; }
  .side-art { order: 2; margin-top: auto; margin-inline-start: -14px; width: 170px; color: #e3f2ee; }
  [dir="rtl"] .side-art { transform: scaleX(-1); }

  /* Top bar */
  .top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: flex-end; gap: 14px; height: 76px; padding: 0 28px; background: rgba(246,248,249,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
  .lang-btn { display: flex; align-items: center; gap: 6px; background: none; border: 0; cursor: pointer; font-size: 13px; color: #44545a; padding: 8px; border-radius: 8px; }
  .lang-btn:hover, .bell:hover { background: #eef2f3; }
  .lang-btn svg { width: 16px; height: 16px; }
  .bell { position: relative; width: 42px; height: 42px; border: 0; background: none; border-radius: 50%; cursor: pointer; display: grid; place-items: center; color: #2c3d43; }
  .bell svg { width: 23px; height: 23px; }
  .sep { width: 1px; height: 34px; background: var(--border); }
  .user { position: relative; }
  .user-btn { display: flex; align-items: center; gap: 12px; background: none; border: 0; cursor: pointer; padding: 4px 6px; border-radius: 12px; text-align: start; }
  .user-btn:hover { background: #eef2f3; }
  .ava { width: 50px; height: 50px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 700; font-size: 16px; overflow: hidden; flex: none; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--border); }
  .ava img { width: 100%; height: 100%; object-fit: cover; }
  .u-name { display: block; font-size: 14px; font-weight: 600; }
  .u-spec { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .user-btn > svg { width: 16px; height: 16px; color: #44545a; }
  .user-menu { position: absolute; top: 110%; inset-inline-end: 0; min-width: 180px; background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(16,35,43,.08); padding: 6px; display: none; }
  .user.open .user-menu { display: block; }
  .user-menu a { display: block; padding: 9px 10px; border-radius: 6px; font-size: 13px; color: var(--ink); text-decoration: none; }
  .user-menu a:hover { background: var(--primary-soft); color: var(--primary); }

  /* Content */
  main { padding: 22px 28px 32px; }
  .stage { position: relative; overflow: hidden; min-height: calc(100vh - 76px - 54px); border-radius: 18px; border: 1px solid var(--border); background: radial-gradient(circle at 0 0, #e9f5f1 0, rgba(233,245,241,0) 220px), linear-gradient(160deg, #ffffff 55%, #fff3e8 100%); display: grid; place-items: center; padding: 40px 20px; }
  .stage::after { content: ""; position: absolute; width: 360px; height: 360px; border-radius: 50%; inset-inline-end: -120px; bottom: -150px; background: rgba(253,214,180,.35); }
  .empty { position: relative; z-index: 1; display: grid; justify-items: center; text-align: center; max-width: 560px; }
  .empty-art { width: 330px; max-width: 100%; height: auto; margin-bottom: 18px; }
  .empty h1 { font-size: 30px; font-weight: 700; color: #15304a; letter-spacing: -.3px; }
  .empty p { margin-top: 10px; font-size: 16px; color: var(--muted); line-height: 1.6; }
  .rule { width: 60px; height: 4px; border-radius: 2px; background: var(--teal); margin: 26px 0; }
  .quote { display: flex; align-items: flex-start; gap: 12px; padding: 16px 22px; border-radius: 12px; background: rgba(230,243,239,.75); font-size: 17px; font-weight: 500; color: #15304a; line-height: 1.5; text-align: start; }
  .quote span.q { font-size: 34px; line-height: .9; color: var(--teal); font-weight: 700; font-family: Georgia, serif; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13px; max-width: calc(100% - 32px); }

  .num { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
  .ov { position: fixed; inset: 0; z-index: 50; background: rgba(16,35,43,.42); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
  .dlg { position: relative; width: 100%; background: #fff; border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.18); margin: auto; }
  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; align-content: start; }
    .side { position: static; height: auto; flex-direction: row; align-items: center; gap: 12px; padding: 10px 12px; border-inline-end: 0; border-bottom: 1px solid var(--border); }
    .logo { flex: none; }
    .logo img { height: 34px; }
    .logo span { display: none; }
    .menu { display: flex; overflow-x: auto; scrollbar-width: none; min-width: 0; }
    .menu::-webkit-scrollbar { display: none; }
    .menu a { flex: none; height: 38px; padding: 0 12px; font-size: 13px; gap: 8px; }
    .menu a svg { width: 18px; height: 18px; }
    .side-art, .support { display: none; }
    .top { height: 66px; padding: 0 12px; gap: 8px; }
    .user-meta { display: none; }
    .ava { width: 42px; height: 42px; }
    main { padding: 14px 12px 24px; }
  }
</style>
</head>

        </button>
        <div class="user-menu" role="menu">
          <a href="doctor-account.html" role="menuitem" data-i18n="profile">My Account</a>
          <a href="doctor-login.html" role="menuitem" id="logout" data-i18n="logout">Log out</a>

    <main><div id="vw"></div></main>
  </div>
</div>

  // ---------- file helpers ----------
  const readURL = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
  async function compress(f) {
    const url = await readURL(f);
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.72);
  }
  // Keeps an image (compressed) or a PDF (up to 1.5 MB) and returns its attachment id.
  async function keepFile(f) {
    const isImg = /^image\//.test(f.type), isPdf = f.type === "application/pdf";
    if (!isImg && !isPdf) throw new Error(t().fileType);
    if (isPdf && f.size > MAXFILE) throw new Error(t().fileBig);
    const data = isImg ? await compress(f) : await readURL(f);
    if (data.length > MAXFILE * 1.37) throw new Error(t().fileBig);
    return putAtt({ name: f.name || (isImg ? "photo.jpg" : "report.pdf"), type: isImg ? "image/jpeg" : "application/pdf", data });
  }
  function viewAtt(id, a) {
    a = a || att(id); if (!a) return;
    const ov = $("viewOv");
    ov.innerHTML = `<div class="pv-box" role="dialog" aria-modal="true" aria-label="${esc(a.name)}"><div class="pv-bh"><b>${esc(a.name)}</b><button type="button" class="px" id="viewX" aria-label="${t().close}">${svg(IC.x, 2.2)}</button></div>
      <div class="pv-bd">${/^image\//.test(a.type) ? `<img src="${a.data}" alt="${esc(a.name)}">` : `<iframe src="${a.data}" title="${esc(a.name)}"></iframe>`}</div></div>`;
    ov.hidden = false; $("viewX").focus();
  }
  const closeView = () => { const ov = $("viewOv"); ov.hidden = true; ov.innerHTML = ""; };

  // ---------- open / edit a patient file ----------

  // ---------- events ----------
  const val = id => ($(id) || {}).value || "";
  function readInputs() {

  function toggle(arr, v, only) { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else { if (only) arr.length = 0; arr.push(v); } }
  function onChoice(g, v) {
    readInputs();
    if (g === "chrS") em.chronic.status = v; else if (g === "chr") toggle(em.chronic.items, v); else if (g === "ecRel") em.contact.rel = em.contact.rel === v ? "" : v;
    else if (g === "mSt") medF.status = v; else if (g === "mTm") toggle(medF.times, v); else if (g === "mDs") medF.dose = v;
    else if (g === "lfLang") lf.lang = v; else if (g === "lfCt") toggle(lf.contact, v); else if (g === "lfPr") lf.provider = v; else if (g === "lfVt") lf.time = v;
    else if (g === "lfAs") { if (v === "none") lf.assist = lf.assist.includes("none") ? [] : ["none"]; else { lf.assist = lf.assist.filter(x => x !== "none"); toggle(lf.assist, v); } }
    else if (g === "nfWho") nfS.who = v; else if (g === "nfRel") nfS.rel = v; else if (g === "nfG") nfS.gender = nfS.gender === v ? "" : v;
    if (g.startsWith("nf")) { $("nfOv").innerHTML = nfView(); const b = $("nfOv").querySelector(`[data-g="${g}"][data-v="${v}"]`); if (b) b.focus(); return; }

  function save(fn, msg) { try { fn(); toast(msg || t().saved); return true; } catch (e) { toast(e.message || t().storeErr); return false; } }

    const list = medOf()[key] || [], it = list.find(x => x.id === id);
    save(() => { putMed({ [key]: list.filter(x => x.id !== id) }); if (it) dropAtt(it[attKey]); }, t().removed); rerender();
  };

  document.addEventListener("click", e => {
    const el = e.target.closest("button, a, [data-view]");
    if (!el) return;
    if (el.dataset.view) { e.preventDefault(); return viewAtt(el.dataset.view); }
    if (el.dataset.mrrep) { const g = madaLabs().find(x => x.report && x.report.key === el.dataset.mrrep), d = MadaStore.get(el.dataset.mrrep); if (g && d) viewAtt(null, { name: g.report.name, type: g.report.type, data: d }); return; }
    if (el.id === "viewX") return closeView();
    if (el.dataset.g) return onChoice(el.dataset.g, el.dataset.v);
    if (el.dataset.tab) { readInputs(); if (tab !== el.dataset.tab) { tab = el.dataset.tab; resetForms(); history.replaceState(null, "", "#" + tab); } rerender(); const sb = document.querySelector('.mt [aria-selected="true"]'); if (sb) sb.scrollIntoView({ block: "nearest", inline: "nearest" }); return; }
    const id = el.id;
    // personal info / new file
    if (id === "openNew") return openNf(false);
    if (id === "editInfo" || id === "phMiss") return openNf(true);
    if (id === "nfX" || id === "nfCancel") return closeNf();
    if (id === "nfSave") { readInputs(); return nfSave(); }
    // emergency
    if (id === "emCancel") { em = null; tried = false; return rerender(); }
    if (id === "emSave") {
      readInputs(); tried = true;
      if (Object.values(emErr()).some(Boolean)) { rerender(); toast(t().fixErr); return scrollBad(); }
      const c = em.chronic, d = { blood: em.blood, chronic: { status: c.status, items: c.status === "yes" ? c.items : [], other: c.status === "yes" && c.items.includes("other") ? c.other.trim() : "" },
        contact: { name: em.contact.name.trim(), mobile: em.contact.mobile.trim(), rel: em.contact.rel }, ...stamp() };
      if (save(() => putMed({ emergency: d }))) { em = null; tried = false; } return rerender();
    }
    // medications
    if (id === "medManual") { medF = medBlank(); tried = false; rerender(); return $("medName").focus(); }
    if (id === "medX" || id === "medCancel") { if (medF && medF.photo && !(medOf().meds || []).some(m => m.photo === medF.photo)) dropAtt(medF.photo); medF = null; tried = false; return rerender(); }
    if (id === "medSave" || id === "medAnother") {
      readInputs(); tried = true;
      if (Object.values(medErr()).some(Boolean)) { rerender(); toast(medErr().conf && !medErr().name ? t().confirmReq : t().fixErr); return scrollBad(); }
      const list = medOf().meds || [], f = medF, m = { id: f.id || uid(), name: f.name.trim(), status: f.status, times: TIMES.filter(x => f.times.includes(x)), dose: f.dose, doseOther: f.dose === "other" ? f.doseOther.trim() : "", photo: f.photo || "", ...stamp() };
      const old = f.id && list.find(x => x.id === f.id);
      if (save(() => putMed({ meds: old ? list.map(x => x.id === f.id ? m : x) : list.concat(m) }), t().medAdded)) { medF = id === "medAnother" ? medBlank() : null; tried = false; }
      rerender(); if (medF) $("medName").focus(); return;
    }
    if (el.dataset.medit) { const m = (medOf().meds || []).find(x => x.id === el.dataset.medit); medF = { ...medBlank(), ...m, times: [...(m.times || [])], confirmed: true }; tried = false; rerender(); return $("medForm").scrollIntoView({ block: "start", behavior: "smooth" }); }
    if (el.dataset.mdel) return removeItem("meds", el.dataset.mdel, "photo");
    // labs
    if (id === "labManual" || id === "labUpload") { labF = { id: "", kind: id === "labManual" ? "manual" : "upload", test: "", code: "", result: "", unit: "", range: "", date: today(), notes: "", att: "" }; tried = false; rerender(); return $("labTest").focus(); }
    if (id === "labX" || id === "labCancel") { if (labF && labF.att && !(medOf().labs || []).some(x => x.att === labF.att)) dropAtt(labF.att); labF = null; tried = false; return rerender(); }
    if (el.dataset.lpick) { readInputs(); const it = labCat().find(x => x.code === el.dataset.lpick); labF.code = it.code; labF.test = it[current]; rerender(); return $("labRes").focus(); }
    if (id === "labSave") {
      readInputs(); tried = true;
      if (Object.values(labErr()).some(Boolean)) { rerender(); toast(t().fixErr); return scrollBad(); }
      const list = medOf().labs || [], f = labF, r = { id: f.id || uid(), kind: f.kind, test: f.test.trim(), code: (f.code || "").trim(), result: f.result.trim(), unit: f.unit.trim(), range: f.range.trim(), date: f.date, notes: f.notes.trim(), att: f.att || "", ...stamp() };
      if (save(() => putMed({ labs: f.id ? list.map(x => x.id === f.id ? r : x) : list.concat(r) }))) { labF = null; tried = false; } return rerender();
    }
    if (el.dataset.ledit) { const r = (medOf().labs || []).find(x => x.id === el.dataset.ledit); labF = { code: "", ...r }; tried = false; rerender(); return $("labForm").scrollIntoView({ block: "start", behavior: "smooth" }); }
    if (el.dataset.ldel) return removeItem("labs", el.dataset.ldel, "att");
    // reports
    if (id === "repNew") { repF = { id: "", title: "", type: "", facility: "", date: today(), notes: "", att: "" }; tried = false; rerender(); return $("repTitle").focus(); }
    if (id === "repX" || id === "repCancel") { if (repF && repF.att) dropAtt(repF.att); repF = null; tried = false; return rerender(); }
    if (id === "repSave") {
      readInputs(); tried = true;
      if (Object.values(repErr()).some(Boolean)) { rerender(); toast(t().fixErr); return scrollBad(); }
      const list = medOf().reports || [], f = repF, r = { id: uid(), title: f.title.trim(), type: f.type, facility: f.facility.trim(), date: f.date, notes: f.notes.trim(), att: f.att, ...stamp() };
      if (save(() => putMed({ reports: list.concat(r) }))) { repF = null; tried = false; } return rerender();
    }
    if (el.dataset.rdel) return removeItem("reports", el.dataset.rdel, "att");
    // lifestyle
    if (id === "lfCancel") { lf = null; tried = false; return rerender(); }
    if (id === "lfSave") {
      readInputs(); tried = true;
      if (Object.values(lfErr()).some(Boolean)) { rerender(); toast(t().fixErr); return scrollBad(); }
      const d = { lang: lf.lang, langOther: lf.lang === "other" ? lf.langOther.trim() : "", contact: ["call", "wa", "sms"].filter(x => lf.contact.includes(x)), provider: lf.provider,
        providerName: lf.provider === "doctor" || lf.provider === "nurse" ? lf.providerName.trim() : "", time: lf.time, assist: ASSIST.filter(x => lf.assist.includes(x)),
        assistOther: lf.assist.includes("other") ? lf.assistOther.trim() : "", notes: lf.notes.trim(), ...stamp() };
      if (save(() => putMed({ lifestyle: d }))) { lf = null; tried = false; } return rerender();
    }
  });
  document.addEventListener("change", async e => {
    const el = e.target, f = el.files && el.files[0];
    if (!f) return;
    try {
      if (el.id === "medPhoto") { const a = await keepFile(f); if (medF && medF.photo && !(medOf().meds || []).some(m => m.photo === medF.photo)) dropAtt(medF.photo); medF = { ...medBlank(a) }; tried = false; rerender(); $("medForm").scrollIntoView({ block: "start", behavior: "smooth" }); $("medName").focus({ preventScroll: true }); }
      else if (el.id === "labFile") { readInputs(); const a = await keepFile(f); if (labF.att) dropAtt(labF.att); labF.att = a; if (!labF.test) labF.test = f.name.replace(/\.[^.]+$/, ""); rerender(); }
      else if (el.id === "repFile") { readInputs(); const a = await keepFile(f); if (repF.att) dropAtt(repF.att); repF.att = a; if (!repF.title) repF.title = f.name.replace(/\.[^.]+$/, ""); rerender(); }
    } catch (err) { toast(err.message || t().storeErr); }
    el.value = "";
  });
  $("viewOv").addEventListener("click", e => { if (e.target === $("viewOv")) closeView(); });
  $("nfOv").addEventListener("click", e => { if (e.target === $("nfOv")) closeNf(); });
  document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (!$("viewOv").hidden) closeView(); else if (!$("nfOv").hidden) closeNf(); else if ($("lp-open")) closePick(); else if (labF) $("labX").click(); });
  // Lab test picker: suggestions from the MADA CARE lab catalogue (name + code).
  const labCat = () => (typeof DrOrders !== "undefined" && DrOrders.labs ? DrOrders.labs() : []);
  const norm = x => String(x || "").toLowerCase().replace(/[\s\-()]/g, "");
  function closePick() { const l = $("labPick"); if (l) { l.hidden = true; $("labTest").setAttribute("aria-expanded", "false"); } const o = $("lp-open"); if (o) o.remove(); }
  function showPick() {
    const l = $("labPick"), q = norm(val("labTest")); if (!l) return;
    const hits = labCat().filter(x => !q || norm(x.en).includes(q) || norm(x.ar).includes(q) || norm(x.code).includes(q)).slice(0, 8);
    l.innerHTML = hits.length ? hits.map(x => `<button type="button" role="option" data-lpick="${x.code}"><span class="num">${x.code}</span><b>${esc(x[current])}</b>${current === "ar" ? `<small dir="ltr">${esc(x.en)}</small>` : ""}</button>`).join("") : `<div class="lp-none">${t().pickNone}</div>`;
    l.hidden = false; $("labTest").setAttribute("aria-expanded", "true");
    if (!$("lp-open")) { const m = document.createElement("i"); m.id = "lp-open"; m.hidden = true; document.body.append(m); }
  }
  document.addEventListener("focusin", e => { if (e.target.id === "labTest" && labF && labF.kind === "manual") showPick(); else if (!e.target.closest || !e.target.closest(".lp-w")) closePick(); });
  document.addEventListener("input", e => { if (e.target.id === "labTest" && labF && labF.kind === "manual") { if (labF.code && labCat().some(x => x.code === labF.code)) { labF.code = ""; $("labCode").value = ""; } showPick(); } });
  document.addEventListener("mousedown", e => { if ($("lp-open") && !e.target.closest(".lp-w")) closePick(); });
  document.addEventListener("click", e => { if (e.target.id === "labOv") $("labX").click(); });
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.some(x => x[0] === h) && h !== tab) { tab = h; resetForms(); rerender(); } });

  document.addEventListener("click", e => { if (e.target.closest("[data-soon]")) { e.preventDefault(); toast(t().soonMsg); } });
  $("bell").addEventListener("click", () => toast(t().noNotes));
  function toast(msg) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2800); }
  function setLang(lang) {
    readInputs();
    current = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t()[el.dataset.i18n]);
    document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t()[el.dataset.i18nAria]));
    document.title = lang === "ar" ? "مدى كير | ملف المريض" : "Mada Care | Patient File";
    DrPortal.render(me, lang, fromList ? "patients" : "visits"); render();
    try { localStorage.setItem("mada-lang", lang); } catch (e) {}
  }
  $("langToggle").addEventListener("click", () => setLang(current === "en" ? "ar" : "en"));
  const user = $("user"), userBtn = $("userBtn");
  userBtn.addEventListener("click", e => { e.stopPropagation(); userBtn.setAttribute("aria-expanded", user.classList.toggle("open")); });
  document.addEventListener("click", () => { user.classList.remove("open"); userBtn.setAttribute("aria-expanded", false); });
  $("logout").addEventListener("click", e => { e.preventDefault(); MadaAuth.logout(); });

  let saved = "en";
  try { saved = localStorage.getItem("mada-lang") || "en"; } catch (e) {}
  setLang(saved);
  try { const m = sessionStorage.getItem("mada-dr-toast"); if (m) { toast(m); sessionStorage.removeItem("mada-dr-toast"); } } catch (e) {}
</script>
</body>
</html>
