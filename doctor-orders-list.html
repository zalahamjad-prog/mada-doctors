<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/mada-logo.png">
<title>Mada Care | Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0b6b5c; --primary-soft: #e6f3ef; --teal: #12a37f; --navy: #0b3a55;
    --ink: #10232b; --muted: #6b7a80; --border: #e3e8ea; --page: #f6f8f9;
    --orange: #d97706; --orange-soft: #fef3e2;
    --font: "Inter", "Tajawal", system-ui, sans-serif;
  }
  [dir="rtl"] { --font: "Tajawal", "Inter", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--page); color: var(--ink); min-height: 100vh; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }

  /* Sidebar */
  .side { position: sticky; top: 0; height: 100vh; background: #fff; border-inline-end: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; gap: 22px; overflow: hidden; }
  .logo { display: flex; align-items: center; gap: 8px; padding: 0 6px; text-decoration: none; color: var(--ink); }
  .logo img { height: 40px; width: auto; }
  .logo b { display: block; font-size: 18px; font-weight: 600; line-height: 1.1; }
  .logo small { font-size: 10.5px; color: var(--primary); }
  .menu { display: grid; gap: 4px; }
  .menu a { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #2c3d43; font-size: 14px; font-weight: 500; }
  .menu a svg { width: 21px; height: 21px; flex: none; }
  .menu a:hover { background: #f3f6f7; }
  .menu a[aria-current="page"] { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .menu a.soon { color: #8a979c; cursor: default; }
  .menu a.soon:hover { background: none; }
  .soon-tag { margin-inline-start: auto; height: 18px; padding: 0 7px; border-radius: 9px; background: var(--orange-soft); color: var(--orange); font-size: 10.5px; font-weight: 600; line-height: 18px; }
  .support { order: 3; display: flex; align-items: center; gap: 12px; padding: 14px 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .support svg { width: 26px; height: 26px; color: #2c3d43; flex: none; }
  .support b { display: block; font-weight: 600; }
  .support a { color: var(--muted); text-decoration: none; }
  .side-art { order: 2; margin-top: auto; margin-inline-start: -14px; width: 170px; color: #e3f2ee; }
  [dir="rtl"] .side-art { transform: scaleX(-1); }

  /* Top bar */
  .top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: flex-end; gap: 14px; height: 76px; padding: 0 28px; background: rgba(246,248,249,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
  .lang-btn { display: flex; align-items: center; gap: 6px; background: none; border: 0; cursor: pointer; font-size: 13px; color: #44545a; padding: 8px; border-radius: 8px; }
  .lang-btn:hover, .bell:hover { background: #eef2f3; }
  .lang-btn svg { width: 16px; height: 16px; }
  .bell { position: relative; width: 42px; height: 42px; border: 0; background: none; border-radius: 50%; cursor: pointer; display: grid; place-items: center; color: #2c3d43; }
  .bell svg { width: 23px; height: 23px; }
  .sep { width: 1px; height: 34px; background: var(--border); }
  .user { position: relative; }
  .user-btn { display: flex; align-items: center; gap: 12px; background: none; border: 0; cursor: pointer; padding: 4px 6px; border-radius: 12px; text-align: start; }
  .user-btn:hover { background: #eef2f3; }
  .ava { width: 50px; height: 50px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 700; font-size: 16px; overflow: hidden; flex: none; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--border); }
  .ava img { width: 100%; height: 100%; object-fit: cover; }
  .u-name { display: block; font-size: 14px; font-weight: 600; }
  .u-spec { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .user-btn > svg { width: 16px; height: 16px; color: #44545a; }
  .user-menu { position: absolute; top: 110%; inset-inline-end: 0; min-width: 180px; background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(16,35,43,.08); padding: 6px; display: none; }
  .user.open .user-menu { display: block; }
  .user-menu a { display: block; padding: 9px 10px; border-radius: 6px; font-size: 13px; color: var(--ink); text-decoration: none; }
  .user-menu a:hover { background: var(--primary-soft); color: var(--primary); }

  /* Content */
  main { padding: 22px 28px 32px; }
  .stage { position: relative; overflow: hidden; min-height: calc(100vh - 76px - 54px); border-radius: 18px; border: 1px solid var(--border); background: radial-gradient(circle at 0 0, #e9f5f1 0, rgba(233,245,241,0) 220px), linear-gradient(160deg, #ffffff 55%, #fff3e8 100%); display: grid; place-items: center; padding: 40px 20px; }
  .stage::after { content: ""; position: absolute; width: 360px; height: 360px; border-radius: 50%; inset-inline-end: -120px; bottom: -150px; background: rgba(253,214,180,.35); }
  .empty { position: relative; z-index: 1; display: grid; justify-items: center; text-align: center; max-width: 560px; }
  .empty-art { width: 330px; max-width: 100%; height: auto; margin-bottom: 18px; }
  .empty h1 { font-size: 30px; font-weight: 700; color: #15304a; letter-spacing: -.3px; }
  .empty p { margin-top: 10px; font-size: 16px; color: var(--muted); line-height: 1.6; }
  .rule { width: 60px; height: 4px; border-radius: 2px; background: var(--teal); margin: 26px 0; }
  .quote { display: flex; align-items: flex-start; gap: 12px; padding: 16px 22px; border-radius: 12px; background: rgba(230,243,239,.75); font-size: 17px; font-weight: 500; color: #15304a; line-height: 1.5; text-align: start; }
  .quote span.q { font-size: 34px; line-height: .9; color: var(--teal); font-weight: 700; font-family: Georgia, serif; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13px; max-width: calc(100% - 32px); }

  .num { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
  .ov { position: fixed; inset: 0; z-index: 50; background: rgba(16,35,43,.42); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
  .dlg { position: relative; width: 100%; background: #fff; border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.18); margin: auto; }
  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; align-content: start; }
    .side { position: static; height: auto; flex-direction: row; align-items: center; gap: 12px; padding: 10px 12px; border-inline-end: 0; border-bottom: 1px solid var(--border); }
    .logo { flex: none; }
    .logo img { height: 34px; }
    .logo span { display: none; }
    .menu { display: flex; overflow-x: auto; scrollbar-width: none; min-width: 0; }
    .menu::-webkit-scrollbar { display: none; }
    .menu a { flex: none; height: 38px; padding: 0 12px; font-size: 13px; gap: 8px; }
    .menu a svg { width: 18px; height: 18px; }
    .side-art, .support { display: none; }
    .top { height: 66px; padding: 0 12px; gap: 8px; }
    .user-meta { display: none; }
    .ava { width: 42px; height: 42px; }
    main { padding: 14px 12px 24px; }
  }

  /* Orders */
  .ol { max-width: 1240px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 18px; }
  .ol-head { display: flex; align-items: center; gap: 16px; padding: 22px 24px; flex-wrap: wrap; border-bottom: 1px solid #eef2f3; }
  .ol-head .ic { width: 56px; height: 56px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; flex: none; }
  .ol-head .ic svg { width: 26px; height: 26px; }
  .ol-head h1 { font-size: 24px; font-weight: 700; color: #15304a; }
  .ol-head p { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .ol-head > div { flex: 1; min-width: 220px; }
  .rv-pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 17px; background: #fdecec; color: #b42318; font-size: 13.5px; font-weight: 700; border: 0; cursor: pointer; }
  .rv-pill svg { width: 16px; height: 16px; }
  .tools { display: flex; gap: 12px; padding: 18px 22px 0; flex-wrap: wrap; }
  .search { flex: 1; min-width: 240px; display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 16px; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
  .search:focus-within { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(18,163,127,.12); }
  .search svg { width: 20px; height: 20px; color: #3d4f57; flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 14px; background: none; }
  .ftabs { display: flex; gap: 4px; padding: 14px 22px 0; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .ftabs button { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; background: none; cursor: pointer; font: inherit; font-size: 14.5px; font-weight: 600; color: var(--muted); }
  .ftabs button[aria-selected="true"] { color: var(--teal); border-color: var(--teal); }
  .ftabs .n { min-width: 24px; height: 22px; padding: 0 7px; border-radius: 11px; background: #eef2f3; color: #44545a; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }
  .ftabs button[aria-selected="true"] .n { background: #e3f4ee; color: #0f6b52; }
  .ftabs .n.red { background: #dc2626; color: #fff; }
  .olist { display: grid; gap: 10px; padding: 16px 22px 22px; }
  .orow { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.6fr) minmax(0, 1fr) auto auto; align-items: center; gap: 16px; padding: 14px 16px; border: 1px solid #e7ecee; border-radius: 14px; text-decoration: none; color: inherit; background: #fff; }
  .orow:hover { border-color: #bfe3d3; background: #fbfefd; }
  .orow.need { border-color: #f5b5b5; background: #fffafa; }
  .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .pa { width: 44px; height: 44px; border-radius: 50%; background: #e8eefc; color: #3b5bdb; display: grid; place-items: center; font-size: 14px; font-weight: 700; flex: none; }
  .who b { display: block; font-size: 14.5px; color: #15304a; }
  .who small, .oid small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; background: #f2f5f6; color: #44545a; font-size: 12.5px; font-weight: 600; }
  .chip svg { width: 14px; height: 14px; }
  .st { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st-need { background: #fdecec; color: #b42318; } .st-wait { background: var(--orange-soft); color: #a35a00; } .st-done { background: #e3f4ee; color: #0f6b52; }
  .go { color: #8a979c; } .go svg { width: 20px; height: 20px; display: block; }
  [dir="rtl"] .go svg, [dir="rtl"] .back svg { transform: scaleX(-1); }
  .num { font-variant-numeric: tabular-nums; letter-spacing: .2px; }
  .none-box { margin: 16px 22px 22px; padding: 30px 16px; text-align: center; color: var(--muted); font-size: 14px; border: 1px dashed #d5dde0; border-radius: 12px; }
  .none-box b { display: block; color: #15304a; font-size: 15.5px; margin-bottom: 4px; }
  /* details */
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--primary); font-size: 14px; font-weight: 600; text-decoration: none; width: max-content; }
  .back svg { width: 16px; height: 16px; }
  .od-h { display: flex; align-items: center; gap: 16px; padding: 20px 24px; flex-wrap: wrap; }
  .od-h .pa { width: 60px; height: 60px; font-size: 19px; }
  .od-h h1 { font-size: 22px; font-weight: 700; color: #15304a; }
  .od-h > div { flex: 1; min-width: 220px; }
  .od-h > .od-acts { flex: none; min-width: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 6px; font-size: 13.5px; color: #5d6d78; }
  .meta b { color: #15304a; font-weight: 600; }
  .od-acts { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn svg { width: 18px; height: 18px; }
  .btn-dark { background: var(--navy); color: #fff; } .btn-dark:hover { background: #082d42; }
  .btn-out { background: #fff; border-color: #cfd9dc; color: #15304a; } .btn-out:hover { background: #f6f8f9; }
  .btn-green { background: var(--teal); color: #fff; } .btn-green:hover { background: #0f8f6f; }
  .sec { padding: 18px 22px 22px; }
  .sec-t { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; color: #15304a; margin-bottom: 12px; }
  .sec-t .ic { width: 38px; height: 38px; border-radius: 11px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; }
  .sec-t .ic svg { width: 19px; height: 19px; }
  .it { border: 1px solid #e7ecee; border-radius: 14px; overflow: hidden; }
  .it + .it { margin-top: 12px; }
  .it.need { border-color: #f5b5b5; box-shadow: 0 0 0 3px #fdecec; }
  .it-h { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #f8fafa; border-bottom: 1px solid #eef2f3; flex-wrap: wrap; }
  .it-h b { flex: 1; min-width: 180px; font-size: 15px; color: #15304a; }
  .it-h small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .code { font-size: 12px; font-weight: 700; color: #0f6b52; background: #e3f4ee; border-radius: 6px; padding: 2px 7px; direction: ltr; display: inline-block; }
  .trk { display: flex; gap: 0; padding: 14px 16px 4px; overflow-x: auto; }
  .trk li { list-style: none; flex: 1; min-width: 92px; position: relative; text-align: center; font-size: 12px; color: #8a979c; padding-top: 26px; }
  .trk li::before { content: ""; position: absolute; top: 6px; inset-inline-start: 50%; transform: translateX(-50%); width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid #cfd9dc; z-index: 1; }
  [dir="rtl"] .trk li::before { transform: translateX(50%); }
  .trk li::after { content: ""; position: absolute; top: 12px; inset-inline-start: 50%; width: 100%; height: 2px; background: #e3e8ea; }
  .trk li:last-child::after { display: none; }
  .trk li.ok { color: #0f6b52; font-weight: 600; } .trk li.ok::before { background: var(--teal); border-color: var(--teal); } .trk li.ok::after { background: var(--teal); }
  .trk li.now { color: #b42318; font-weight: 700; } .trk li.now::before { border-color: #dc2626; background: #fdecec; }
  .trk small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .rt { width: 100%; border-collapse: collapse; font-size: 14px; }
  .rt th { text-align: start; font-size: 12px; font-weight: 700; color: var(--muted); padding: 10px 16px 6px; }
  .rt td { padding: 9px 16px; border-top: 1px solid #f0f3f4; color: #2c3d43; }
  .rt td:first-child { width: 110px; font-size: 12.5px; font-weight: 700; color: #0f6b52; }
  .rt tr.a td:first-child { color: #6b7a80; font-weight: 600; padding-inline-start: 28px; }
  .rt tr.t td { background: #fbfcfc; }
  .rt b.v { font-size: 15px; color: #15304a; }
  .rt small { color: var(--muted); font-size: 12px; }
  .rt [dir="ltr"] { display: inline-block; white-space: nowrap; unicode-bidi: isolate; }
  .pend { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #a35a00; }
  .pend svg { width: 15px; height: 15px; }
  .tg { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 7px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .tg.hi, .tg.lo { background: #fdecec; color: #c0392b; } .tg.nm { background: #e3f4ee; color: #0f6b52; } .tg.cr { background: #c0392b; color: #fff; }
  .rad-ref { display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 12px 16px; font-size: 13px; color: var(--muted); border-bottom: 1px solid #eef2f3; }
  .rad-ref b { color: #15304a; }
  .rad-rep { margin: 14px 16px 16px; padding: 14px 16px; border: 1px solid #e3ece9; border-inline-start: 4px solid var(--primary); border-radius: 10px; background: #fbfdfc; display: grid; gap: 8px; justify-items: start; }
  .rad-rep small { font-size: 12px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: .3px; }
  .rad-rep p { font-size: 14.5px; line-height: 1.75; color: #2c3d43; white-space: pre-wrap; }
  .txt-res { padding: 12px 16px; font-size: 14px; line-height: 1.7; color: #2c3d43; white-space: pre-wrap; }
  .it-f { padding: 12px 16px; border-top: 1px solid #eef2f3; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13.5px; color: #44545a; }
  .rv { padding: 14px 16px 16px; border-top: 1px solid #f5d0d0; background: #fffafa; display: grid; gap: 10px; }
  .rv b { font-size: 14.5px; color: #b42318; display: flex; align-items: center; gap: 8px; }
  .rv b svg { width: 18px; height: 18px; }
  .rv textarea { width: 100%; min-height: 90px; border: 1px solid #dfe5e8; border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14.5px; resize: vertical; outline: 0; background: #fff; }
  .rv-pdf { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: #fff7e6; border: 1px solid #f5d48a; color: #7a4b00; }
  .rv-pdf svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: #b7791f; }
  .rv-pdf b { display: block; font-size: 13.5px; font-weight: 600; color: #7a4b00; line-height: 1.55; }
  .rv-pdf small { display: block; font-size: 12px; color: #8a6420; margin-top: 3px; line-height: 1.5; }
  .rv textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(18,163,127,.12); }
  .rv.dn { border: 1px solid #d7ebe4; border-radius: 12px; background: #f7fcfa; margin-bottom: 12px; } .rv.dn b { color: #0f6b52; }
  .btn-xs { height: 28px; padding: 0 10px; font-size: 12.5px; } .btn-xs svg { width: 14px; height: 14px; }
  .rv-a { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .apv { padding: 12px 16px; border-top: 1px solid #d6efe4; background: #f4fbf8; font-size: 13.5px; color: #0f6b52; display: grid; gap: 4px; }
  .apv b { display: flex; align-items: center; gap: 6px; } .apv b svg { width: 16px; height: 16px; }
  .apv span { color: #2c3d43; }
  .nts { padding: 10px 16px; border-top: 1px solid #eef2f3; font-size: 13.5px; color: #44545a; display: grid; gap: 4px; }
  .nts small { color: var(--muted); }
  .tg-t { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11.5px; font-weight: 600; background: #eef2f3; color: #44545a; }
  .tg-t.red { background: #fdecec; color: #b42318; } .tg-t.grn { background: #e3f4ee; color: #0f6b52; } .tg-t.org { background: var(--orange-soft); color: #a35a00; }
  .rq { display: grid; gap: 8px; padding: 14px 24px 18px; border-top: 1px solid #eef2f3; font-size: 13.5px; color: #2c3d43; }
  .rq b { color: #15304a; } .rq .ck { display: flex; flex-wrap: wrap; gap: 6px; }
  .lg { padding: 10px 16px; border-top: 1px solid #eef2f3; display: grid; gap: 8px; font-size: 13px; color: #44545a; }
  .lg > small { color: var(--muted); }
  .lg-r b { color: #15304a; font-weight: 600; } .lg-r .by { color: var(--muted); font-size: 12px; } .lg-r .kv { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 2px; }
  .esc { padding: 10px 16px; border-top: 1px solid #f6d9a8; background: #fffaf2; display: grid; gap: 6px; font-size: 13px; }
  .tn { display: grid; gap: 10px; }

    $("vw").innerHTML = `<a class="back" href="doctor-orders-list.html">${svg(IC.l, 2)}${t().back}</a>
      <section class="card"><div class="od-h"><span class="pa">${esc(initials(nm(r.patient).en))}</span><div><h1>${esc(pName(r))}</h1>
        <div class="meta"><span>${t().orderNo}: <b class="num">${esc(r.id)}</b></span><span>${esc(tx("fileNo", { n: "" }).trim())}: <b class="num">${esc(r.mrn || "—")}</b></span>${r.orderId ? `<span>${t().visitNo}: <b class="num">${esc(r.orderId)}</b></span>` : ""}<span>${t().date}: <b>${esc(fmtT(r.createdAt))}</b></span><span class="st st-${s}">${t()["st_" + s]}</span></div></div>
        <div class="od-acts">${r.mrn ? `<a class="btn btn-out" href="doctor-patient.html?mrn=${encodeURIComponent(r.mrn)}">${svg(IC.folder)}${t().openFile}</a>` : ""}${done ? `<a class="btn btn-dark" href="doctor-visit.html?id=${encodeURIComponent(r.orderId)}&view=1">${svg(IC.eye)}${t().openVisit}</a>` : ""}</div></div></section>
      ${rqBox(r)}${sec("lab")}${sec("radiology")}${sec("other")}${teamBox(r)}
      <p class="ol-note">${svg(IC.info, 2)}${t().demo}</p>`;
  }
  const qid = () => new URLSearchParams(location.search).get("id");
  function render() { qid() ? detail(qid()) : list(); }

  function openFile(r, it) { const rl = logAt(it, "resulted"); showFile(it.report || (rl && rl.data && rl.data.file)); }
  function showFile(f) {
    const data = f && MadaStore.get(f.key);
    if (!data) return toast(t().fileGone);
    const ov = $("fileOv");
    ov.innerHTML = `<div class="ov-box" role="dialog" aria-modal="true" aria-label="${esc(f.name)}"><div class="ov-h"><b>${esc(f.name)}</b><button type="button" class="px" id="fileX" aria-label="${t().close}">${svg(IC.x, 2.2)}</button></div>
      <div class="ov-b">${/^image\//.test(f.type) ? `<img src="${data}" alt="${esc(f.name)}">` : `<iframe src="${data}" title="${esc(f.name)}"></iframe>`}</div></div>`;
    ov.hidden = false; $("fileX").focus();
  }
  const closeFile = () => { const ov = $("fileOv"); ov.hidden = true; ov.innerHTML = ""; };
  $("fileOv").addEventListener("click", e => { if (e.target.id === "fileOv" || e.target.closest("#fileX")) closeFile(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("fileOv").hidden) closeFile(); });

  $("vw").addEventListener("input", e => { if (e.target.id !== "q") return; q = e.target.value; const pos = e.target.selectionStart; render(); const i = $("q"); i.focus(); i.setSelectionRange(pos, pos); });
  $("vw").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.f) { filt = b.dataset.f; history.replaceState(null, "", location.pathname + "#" + filt); return render(); }
    const r = M.get(qid()); if (!r) return;
    if (b.dataset.rnote) {
      const v = $("rnote").value.trim(); if (!v) { $("err-rnote").hidden = false; $("rnote").focus(); return; }
      if (r.status !== "open") return toast(t().dnClosed);
      M.update(r.id, { notes: [...(r.notes || []), { type: "doctor", text: v, by: me.name, at: new Date().toISOString() }] });
      render(); return toast(t().noteToast);
    }
    if (b.dataset.lf) { const it2 = r.items.find(x => x.id === b.dataset.lf), l = it2 && it2.log[+b.dataset.li]; return showFile(l && l.data && l.data.file); }
    const itId = b.dataset.approve || b.dataset.note || b.dataset.file, it = r.items.find(x => x.id === itId); if (!it) return;
    if (b.dataset.file) return openFile(r, it);
    const note = $("note-" + itId).value.trim();
    if (b.dataset.note && !note) { $("err-" + itId).hidden = false; $("note-" + itId).focus(); return; }
    if (b.dataset.approve) M.advance(r.id, itId, me.name, note ? { docNote: note } : null);
    else M.patchItem(r.id, itId, x => ({ docNotes: [...(x.docNotes || []), { by: me.name, at: new Date().toISOString(), text: note }] }));
    DrPortal.render(me, current, "orders"); render(); toast(b.dataset.approve ? t().approvedToast : t().noteToast);
  });
  window.addEventListener("storage", e => { if (!e.key || e.key === "mada-medical") render(); });

  document.addEventListener("click", e => { if (e.target.closest("[data-soon]")) { e.preventDefault(); toast(t().soonMsg); } });
  $("bell").addEventListener("click", () => toast(t().noNotes));
  function toast(msg) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3200); }
  function setLang(lang) {
    current = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t()[el.dataset.i18n]);
    document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t()[el.dataset.i18nAria]));
    document.title = lang === "ar" ? "مدى كير | الأوردرات" : "Mada Care | Orders";
    DrPortal.render(me, lang, "orders"); render();
    try { localStorage.setItem("mada-lang", lang); } catch (e) {}
  }
  $("langToggle").addEventListener("click", () => setLang(current === "en" ? "ar" : "en"));
  const user = $("user"), userBtn = $("userBtn");
  userBtn.addEventListener("click", e => { e.stopPropagation(); userBtn.setAttribute("aria-expanded", user.classList.toggle("open")); });
  document.addEventListener("click", () => { user.classList.remove("open"); userBtn.setAttribute("aria-expanded", false); });
  $("logout").addEventListener("click", e => { e.preventDefault(); MadaAuth.logout(); });

  let saved = "en";
  try { saved = localStorage.getItem("mada-lang") || "en"; } catch (e) {}
  { const h = location.hash.slice(1); if (["need", "wait", "done", "all"].includes(h)) filt = h; }
  setLang(saved);
</script>
</body>
</html>
